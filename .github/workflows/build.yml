name: Build Pikafish master Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      ARCH: x86-64-universal
      COMP: clang
    steps:
      - uses: actions/checkout@v4

      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          install: mingw-w64-clang-x86_64-clang make git

      - name: Get master source
        shell: msys2 {0}
        run: |
          curl -sL https://codeload.github.com/official-pikafish/Pikafish/tar.gz/refs/heads/master -o src.tar.gz
          tar -xzf src.tar.gz
          mv Pikafish-master pkf



      - name: Overwrite with fixed source
        shell: msys2 {0}
        run: |
          cp fixed-src/position.h      pkf/src/position.h
          cp fixed-src/position.cpp    pkf/src/position.cpp
          cp fixed-src/engine.cpp      pkf/src/engine.cpp
          cp fixed-src/ucioption.cpp   pkf/src/ucioption.cpp
          echo "--- Fixed files copied ---"
          grep -c "ChineseRule" pkf/src/position.cpp
          grep -c "Repetition Rule" pkf/src/engine.cpp

      - name: Build
        working-directory: pkf/src
        shell: msys2 {0}
        run: make -j4 build EXE=pikafish-master.exe

      - name: Strip
        working-directory: pkf/src
        shell: msys2 {0}
        run: make strip EXE=pikafish-master.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Pikafish-Windows-x86-64-universal
          path: pkf/src/pikafish-master.exe
