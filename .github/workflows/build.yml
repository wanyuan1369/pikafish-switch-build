name: Build Switch Windows

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          install: mingw-w64-clang-x86_64-clang make git

      - name: Get Switch source
        shell: msys2 {0}
        run: |
          curl -sL https://codeload.github.com/PikaCat-OuO/Pikafish/tar.gz/refs/heads/Switch -o src.tar.gz
          tar -xzf src.tar.gz
          mv Pikafish-Switch pkf
          ls pkf/src

      - name: Get net
        shell: msys2 {0}
        run: |
          curl -sL https://github.com/official-pikafish/Networks/releases/download/master-net/pikafish.nnue -o pkf/src/pikafish.nnue || echo "no net"

      - name: Build
        working-directory: pkf/src
        shell: msys2 {0}
        run: make -j profile-build EXE=pikafish-switch.exe ARCH=x86-64 COMP=clang

      - name: Strip
        working-directory: pkf/src
        shell: msys2 {0}
        run: make strip EXE=pikafish-switch.exe COMP=clang

      - uses: actions/upload-artifact@v4
        with:
          name: Pikafish-Windows-x86-64-universal
          path: |
            pkf/src/pikafish-switch.exe
            pkf/src/pikafish.nnue
